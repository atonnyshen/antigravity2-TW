name: Cross-platform regression tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.17.0'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --check localization_engine.js
      - run: node --check auto_localize_watcher.js
      - run: npm test
      - name: Validate shell syntax
        if: runner.os != 'Windows'
        shell: bash
        run: |
          for file in *.sh *.command; do bash -n "$file"; done
      - name: Parse all PowerShell installers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($file in Get-ChildItem *.ps1) {
            $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$null, [ref]$errors)
            if ($errors.Count -gt 0) { throw "$file : $errors" }
          }
      - name: Check batch entrypoints exist (not runtime validation)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($file in @('點兩下安裝繁體中文.bat', '點兩下還原官方英文.bat', '點兩下安裝Windows背景守護.bat', '點兩下卸載Windows背景守護.bat')) {
            if (-not (Test-Path $file)) { throw "Missing $file" }
          }
